[package]
name = "justin"
version = "0.1.0"
edition = "2024"
description = "Justin (time series + question in, answer out) in Rust on candle: Timestral + MiniLM, question heads and the location head"
license = "Apache-2.0"

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
